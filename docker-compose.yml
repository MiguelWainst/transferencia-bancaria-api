services:
  postgres:
    image: postgres:18.4
    container_name: transferencia-bancaria-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - transferencia_bancaria_data:/var/lib/postgresql

volumes:
  transferencia_bancaria_data: