services:
  postgres:
    image: postgres:18.4
    container_name: transferencia-bancaria-db
    environment:
      POSTGRES_USER: miguel
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: transferencia_bancaria
    ports:
      - "5432:5432"
    volumes:
      - transferencia_bancaria_data:/var/lib/postgresql/data

volumes:
  transferencia_bancaria_data: